[workspace]
members = [
  "crates/echoevm-core",
  "crates/echoevm-protocol",
  "crates/echoevm-cli",
  "crates/echoevm-wasm",
]
default-members = ["crates/echoevm-cli"]
resolver = "2"

[workspace.package]
version = "1.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/smallyunet/echoevm"

[workspace.dependencies]
alloy-primitives = { version = "1.6.1", features = ["serde"] }
alloy-consensus = { version = "1.6.1", features = ["k256", "serde"] }
alloy-eips = "1.6.1"
alloy-dyn-abi = "1.6.1"
alloy-json-abi = "1.6.1"
alloy-rlp = "0.3.13"
alloy-trie = { version = "0.9.5", features = ["ethereum"] }
ark-bls12-381 = "0.6.0"
ark-bn254 = "0.6.0"
ark-ec = "0.6.0"
ark-ff = "0.6.0"
ark-serialize = "0.6.0"
anyhow = "1.0.102"
clap = { version = "4.6.6", features = ["derive", "env"] }
hex = "0.4.3"
k256 = { version = "0.13.4", features = ["ecdsa"] }
num-bigint = "0.4.6"
num-traits = "0.2.19"
p256 = { version = "0.13.2", features = ["ecdsa"] }
ripemd = "0.1.3"
getrandom = { version = "0.2.17", features = ["js"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
tiny_http = "0.12.0"
ureq = { version = "2.12.1", features = ["json"] }
wasm-bindgen = "0.2.127"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
panic = "abort"
