name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: make test-bytecode-conformance test-explain test-test-witness
      - run: cargo build --locked --release -p echoevm
      - run: cargo build --locked -p echoevm-wasm --target wasm32-unknown-unknown --profile wasm-release
      - run: bash scripts/test-cli.sh

  official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/cache@v5
        with:
          path: tests/official/.cache
          key: eest-tests-v20.0.1-3586193d
      - run: make test-official-fixtures

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - run: cargo build --locked -p echoevm
      - run: npm run check && npm test
        working-directory: editors/vscode
      - run: npm run test:integration
        working-directory: editors/vscode
        env:
          ECHOEVM_TEST_BINARY: ${{ github.workspace }}/target/debug/echoevm
      - run: npm run package:vsix
        working-directory: editors/vscode
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: make test-chrome
      - run: make test-deploy test-skills

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t echoevm:ci .
      - run: docker run --rm echoevm:ci version --json
      - run: ECHOEVM_IMAGE=echoevm:ci docker compose -f deploy/docker-compose.yml config --quiet
