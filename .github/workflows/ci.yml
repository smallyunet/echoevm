name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
      - name: Build
        run: go build -v ./...
      - name: Unit, integration, and E2E tests
        run: make test-unit test-integration test-e2e
      - name: Deployment contract
        run: make test-deploy
      - name: Conformance report (official + geth differential)
        run: make test-conformance

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
      - name: Build CLI
        run: go build -v ./cmd/echoevm
      - name: Validate production image and configuration
        run: |
          docker build --build-arg VERSION=ci -t echoevm:ci .
          docker run --rm --entrypoint sh echoevm:ci -c 'test -s /usr/local/share/echoevm/deploy/docker-compose.yml && test -s /usr/local/share/echoevm/deploy/Caddyfile && test -s /usr/local/share/echoevm/deploy/deploy-image.sh'
          ECHOEVM_IMAGE=echoevm:ci docker compose -f deploy/docker-compose.yml config --quiet
          docker run --rm --network none -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Test protocol client
        run: npm test
      - name: Package VSIX
        run: npm run package:vsix
