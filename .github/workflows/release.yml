name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  cli:
    name: CLI ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-amd64
            binary: echoevm
          - os: ubuntu-24.04-arm
            asset: linux-arm64
            binary: echoevm
          - os: macos-15-intel
            asset: darwin-amd64
            binary: echoevm
          - os: macos-15
            asset: darwin-arm64
            binary: echoevm
          - os: windows-latest
            asset: windows-amd64
            binary: echoevm.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo build --locked --release -p echoevm
      - shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/echoevm-${{ matrix.asset }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.asset }}
          path: dist/echoevm-*

  publish:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: npm ci && npm run package:vsix && cp echoevm-*.vsix ../../dist/
        working-directory: editors/vscode
      - run: bash extensions/chrome/scripts/build.sh
        env:
          ECHOEVM_RELEASE_TAG: ${{ github.ref_name }}
      - run: make package-skills
      - run: sha256sum echoevm-* > SHA256SUMS
        working-directory: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "EchoEVM $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/echoevm-* dist/SHA256SUMS --clobber

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/smallyunet/echoevm:${{ github.ref_name }}
            ghcr.io/smallyunet/echoevm:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
