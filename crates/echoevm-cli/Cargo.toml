[package]
name = "echoevm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded Rust EVM executor and bounded execution evidence CLI"
readme = "../../README.md"
keywords = ["ethereum", "evm", "solidity", "replay", "debugger"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "echoevm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
alloy-dyn-abi.workspace = true
alloy-json-abi.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-trie.workspace = true
clap.workspace = true
echoevm-core = { version = "1.7.0", path = "../echoevm-core" }
echoevm-protocol = { version = "1.7.0", path = "../echoevm-protocol" }
hex.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tiny_http.workspace = true
ureq.workspace = true
