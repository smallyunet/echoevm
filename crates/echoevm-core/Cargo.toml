[package]
name = "echoevm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded Rust EVM execution, tracing, and self-contained transaction replay"
readme = "../../README.md"
keywords = ["ethereum", "evm", "replay", "wasm"]
categories = ["development-tools", "wasm"]

[features]
default = ["native-crypto"]
native-crypto = ["revm/c-kzg", "revm/blst", "revm/secp256k1", "revm/portable"]
official-fixtures = []

[dependencies]
alloy-consensus.workspace = true
alloy-eips.workspace = true
echoevm-protocol = { version = "1.1.0", path = "../echoevm-protocol" }
revm.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
