[package]
name = "echoevm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Independent Rust EVM execution, tracing, and self-contained transaction replay"
readme = "../../README.md"
keywords = ["ethereum", "evm", "replay", "wasm"]
categories = ["development-tools", "wasm"]

[features]
default = []
native-crypto = []
official-fixtures = []

[dependencies]
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-trie.workspace = true
ark-bls12-381.workspace = true
ark-bn254.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
ark-serialize.workspace = true
echoevm-protocol = { version = "1.7.0", path = "../echoevm-protocol" }
hex.workspace = true
k256.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
p256.workspace = true
ripemd.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
